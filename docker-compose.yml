services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: crm_owner
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
